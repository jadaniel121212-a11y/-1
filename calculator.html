<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>食物熱量計算機 - 個人體重管理系統</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .calc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
            margin-bottom: 14px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-group label {
            font-size: 0.9rem;
            font-weight: 600;
        }
        .form-group input,
        .form-group select {
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            background: #fff;
            color: #111827;
        }
        .match-badge {
            font-size: 0.85rem;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 14px;
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            color: #065f46;
        }
        .match-badge.fallback {
            background: #fffbeb;
            border-color: #fde68a;
            color: #92400e;
        }
        .preset-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }
        .btn-chip {
            padding: 6px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 999px;
            background: #f8fafc;
            color: #1e293b;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .btn-chip:hover {
            background: #2563eb;
            color: #fff;
            border-color: #2563eb;
        }
        .result-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 16px;
            margin-top: 12px;
        }
        .total-cal {
            font-size: 2rem;
            font-weight: 700;
            color: #16a34a;
            margin: 4px 0 10px;
        }
        .macro-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 14px;
            text-align: center;
        }
        .macro-item {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 8px;
            font-size: 0.9rem;
        }
        .btn-primary {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            background: #16a34a;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-primary:hover {
            background: #15803d;
        }
        .btn-danger-sm {
            padding: 4px 10px;
            border: 1px solid #ef4444;
            border-radius: 6px;
            background: transparent;
            color: #ef4444;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .log-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-bottom: 1px solid #e2e8f0;
            gap: 12px;
        }
        .log-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="container">
            <h1 class="site-title">食物熱量計算機</h1>
            <p class="tagline">輸入食物名稱、克數與烹調方式，系統自動辨識熱量與營養素。</p>
            <nav class="nav-bar">
                <a href="index.html" class="nav-link">首頁</a>
                <a href="food.html" class="nav-link">可食用食物</a>
                <a href="calculator.html" class="nav-link active">熱量計算機</a>
                <a href="rules.html" class="nav-link">管理體重規則</a>
                <a href="record.html" class="nav-link">體重紀錄</a>
                <a href="login.html" class="nav-link">登入 / 註冊</a>
            </nav>
        </div>
    </header>

    <main class="container content">
        <section class="card">
            <h2>輸入食物自動算熱量</h2>

            <div class="preset-row" id="quickFoods"></div>

            <div class="calc-grid">
                <div class="form-group">
                    <label for="foodInput">1. 輸入食物名稱</label>
                    <input type="text" id="foodInput" list="foodDatalist" placeholder="例如：雞胸肉、白飯、鮭魚、地瓜..." value="雞胸肉">
                    <datalist id="foodDatalist"></datalist>
                </div>

                <div class="form-group">
                    <label for="gramsInput">2. 食用克數 (g)</label>
                    <input type="number" id="gramsInput" min="1" step="1" value="150">
                </div>

                <div class="form-group">
                    <label for="cookMethod">3. 烹調方式</label>
                    <select id="cookMethod">
                        <option value="boil">水煮 / 清蒸 / 無油氣炸（+0 kcal / 100g）</option>
                        <option value="pan_light">乾煎 / 少油炒（+22 kcal / 100g）</option>
                        <option value="stir_braise">一般炒 / 紅燒 / 滷味（+55 kcal / 100g）</option>
                        <option value="deep_fry">油炸 / 裹粉炸（+135 kcal / 100g）</option>
                    </select>
                </div>
            </div>

            <!-- 系統自動辨識提示列 -->
            <div id="matchStatus" class="match-badge"></div>

            <div class="preset-row">
                <span style="font-size: 0.85rem; color: #64748b; align-self: center;">快速克數：</span>
                <button type="button" class="btn-chip" onclick="setGrams(50)">50g</button>
                <button type="button" class="btn-chip" onclick="setGrams(100)">100g</button>
                <button type="button" class="btn-chip" onclick="setGrams(150)">150g</button>
                <button type="button" class="btn-chip" onclick="setGrams(200)">200g</button>
                <button type="button" class="btn-chip" onclick="setGrams(300)">300g</button>
            </div>

            <div class="result-box">
                <div>預估總熱量</div>
                <div class="total-cal"><span id="totalCal">173</span> kcal</div>
                <div style="font-size: 0.85rem; margin-bottom: 12px;">
                    食材本身：<strong id="rawCal">173</strong> kcal ｜ 烹調額外熱量：<strong id="extraCal">+0</strong> kcal
                </div>

                <div class="macro-summary">
                    <div class="macro-item">蛋白質：<strong><span id="totalPro">35.0</span> g</strong></div>
                    <div class="macro-item">碳水：<strong><span id="totalCarb">0.0</span> g</strong></div>
                    <div class="macro-item">脂肪（含油）：<strong><span id="totalFat
