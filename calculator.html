<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>食物熱量計算機 - 個人體重管理系統</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .calc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
            margin-bottom: 14px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-group label {
            font-size: 0.9rem;
            font-weight: 600;
        }
        .form-group input,
        .form-group select {
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            background: #fff;
            color: #111827;
        }
        .match-badge {
            font-size: 0.85rem;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 14px;
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            color: #065f46;
        }
        .match-badge.fallback {
            background: #fffbeb;
            border-color: #fde68a;
            color: #92400e;
        }
        .preset-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }
        .btn-chip {
            padding: 6px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 999px;
            background: #f8fafc;
            color: #1e293b;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .btn-chip:hover {
            background: #2563eb;
            color: #fff;
            border-color: #2563eb;
        }
        .result-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 16px;
            margin-top: 12px;
        }
        .total-cal {
            font-size: 2rem;
            font-weight: 700;
            color: #16a34a;
            margin: 4px 0 10px;
        }
        .macro-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 14px;
            text-align: center;
        }
        .macro-item {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 8px;
            font-size: 0.9rem;
        }
        .btn-primary {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            background: #16a34a;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-primary:hover {
            background: #15803d;
        }
        .btn-danger-sm {
            padding: 4px 10px;
            border: 1px solid #ef4444;
            border-radius: 6px;
            background: transparent;
            color: #ef4444;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .log-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-bottom: 1px solid #e2e8f0;
            gap: 12px;
        }
        .log-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="container">
            <h1 class="site-title">食物熱量計算機</h1>
            <p class="tagline">輸入食物或店家品項、克數與烹調方式，系統自動辨識熱量與營養素。</p>
            <nav class="nav-bar">
                <a href="index.html" class="nav-link">首頁</a>
                <a href="food.html" class="nav-link">可食用食物</a>
                <a href="calculator.html" class="nav-link active">熱量計算機</a>
                <a href="rules.html" class="nav-link">管理體重規則</a>
                <a href="record.html" class="nav-link">體重紀錄</a>
                <a href="login.html" class="nav-link">登入 / 註冊</a>
            </nav>
        </div>
    </header>

    <main class="container content">
        <section class="card">
            <h2>輸入食物自動算熱量</h2>

            <div class="preset-row" id="quickFoods"></div>

            <div class="calc-grid">
                <div class="form-group">
                    <label for="foodInput">1. 輸入食物或店家品項</label>
                    <input type="text" id="foodInput" list="foodDatalist" placeholder="例如：雙層牛肉起司堡、麥脆雞、鹹酥雞、雪花牛、低脂牛..." value="雞胸肉">
                    <datalist id="foodDatalist"></datalist>
                </div>

                <div class="form-group">
                    <label for="gramsInput">2. 食用克數 (g)</label>
                    <input type="number" id="gramsInput" min="1" step="1" value="150">
                </div>

                <div class="form-group">
                    <label for="cookMethod">3. 烹調方式</label>
                    <select id="cookMethod">
                        <option value="boil">水煮 / 清蒸 / 無油氣炸（+0 kcal / 100g）</option>
                        <option value="pan_light">乾煎 / 少油炒（+22 kcal / 100g）</option>
                        <option value="stir_braise">一般炒 / 紅燒 / 滷味（+55 kcal / 100g）</option>
                        <option value="deep_fry">油炸 / 裹粉炸（+135 kcal / 100g）</option>
                    </select>
                </div>
            </div>

            <div id="matchStatus" class="match-badge"></div>

            <div class="preset-row">
                <span style="font-size: 0.85rem; color: #64748b; align-self: center;">快速克數：</span>
                <button type="button" class="btn-chip" onclick="setGrams(50)">50g</button>
                <button type="button" class="btn-chip" onclick="setGrams(100)">100g</button>
                <button type="button" class="btn-chip" onclick="setGrams(150)">150g</button>
                <button type="button" class="btn-chip" onclick="setGrams(200)">200g</button>
                <button type="button" class="btn-chip" onclick="setGrams(300)">300g</button>
            </div>

            <div class="result-box">
                <div>預估總熱量</div>
                <div class="total-cal"><span id="totalCal">173</span> kcal</div>
                <div style="font-size: 0.85rem; margin-bottom: 12px;">
                    食材本身：<strong id="rawCal">173</strong> kcal ｜ 烹調額外熱量：<strong id="extraCal">+0</strong> kcal
                </div>

                <div class="macro-summary">
                    <div class="macro-item">蛋白質：<strong><span id="totalPro">35.0</span> g</strong></div>
                    <div class="macro-item">碳水：<strong><span id="totalCarb">0.0</span> g</strong></div>
                    <div class="macro-item">脂肪（含油）：<strong><span id="totalFat">2.9</span> g</strong></div>
                </div>

                <button type="button" class="btn-primary" id="addBtn">＋ 加入今日計算清單</button>
            </div>
        </section>

        <section class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h2 style="margin: 0;">今日計算清單</h2>
                <button type="button" class="btn-danger-sm" id="clearBtn">清空清單</button>
            </div>
            <p style="margin-bottom: 12px;">
                今日累計：<strong><span id="dayTotalCal">0</span> kcal</strong>
                （蛋白質 <span id="dayTotalPro">0</span>g / 碳水 <span id="dayTotalCarb">0</span>g / 脂肪 <span id="dayTotalFat">0</span>g）
            </p>
            <div id="logList"></div>
        </section>
    </main>

    <script>
        // 內建資料庫（以每 100g / 100ml 為計算基準，依克數比例換算）
        const FOOD_DB = [
            // 基礎食材
            { name: "雞胸肉", keywords: ["雞胸", "舒肥雞", "7-11雞胸", "超商雞胸"], cal: 115, p: 23.3, c: 0, f: 1.9 },
            { name: "雞腿肉（去皮）", keywords: ["去皮雞腿", "雞腿排"], cal: 155, p: 19.5, c: 0, f: 8.2 },
            { name: "帶皮雞腿肉", keywords: ["雞腿", "大雞腿", "棒棒腿"], cal: 215, p: 17.5, c: 0, f: 15.6 },
            { name: "豬里肌（瘦肉）", keywords: ["豬里肌", "豬肉片", "瘦豬肉"], cal: 145, p: 21.5, c: 0, f: 6.0 },
            { name: "豬五花 / 控肉", keywords: ["五花肉", "三層肉", "控肉", "爌肉"], cal: 380, p: 13.0, c: 0, f: 36.0 },
            { name: "牛腱 / 牛板腱", keywords: ["牛腱", "牛肉", "牛排", "沙朗"], cal: 145, p: 21.0, c: 0, f: 6.2 },
            { name: "鮭魚", keywords: ["鮭魚肚", "鮭魚排"], cal: 208, p: 20.0, c: 0, f: 13.4 },
            { name: "雞蛋（全蛋）", keywords: ["水煮蛋", "荷包蛋", "茶葉蛋", "溏心蛋", "蛋", "7-11茶葉蛋"], cal: 144, p: 12.6, c: 1.5, f: 9.5 },
            { name: "板豆腐", keywords: ["傳統豆腐", "豆腐"], cal: 88, p: 8.5, c: 2.3, f: 5.0 },
            { name: "無糖豆漿", keywords: ["豆漿"], cal: 32, p: 3.4, c: 1.2, f: 1.5 },
            { name: "白飯（熟）", keywords: ["米飯", "飯", "白米飯"], cal: 183, p: 3.1, c: 41.0, f: 0.3 },
            { name: "糙米飯 / 五穀飯（熟）", keywords: ["糙米", "五穀飯", "紫米飯"], cal: 155, p: 3.3, c: 32.8, f: 1.1 },
            { name: "地瓜（蒸/烤）", keywords: ["番薯", "烤地瓜", "蒸地瓜", "地瓜"], cal: 124, p: 1.4, c: 29.0, f: 0.2 },
            { name: "燕麥片（乾重）", keywords: ["大燕麥片", "麥片", "燕麥"], cal: 389, p: 13.2, c: 67.7, f: 6.5 },
            { name: "花椰菜 / 高麗菜 / 青菜", keywords: ["花椰菜", "高麗菜", "青江菜", "菠菜", "地瓜葉", "青菜", "燙青菜"], cal: 26, p: 1.8, c: 5.2, f: 0.3 },

            // 50嵐
            { name: "50嵐 純茶（四季春/綠/紅/青）", keywords: ["50嵐", "50嵐純茶", "50嵐綠茶", "50嵐紅茶", "50嵐四季春", "50嵐黃金烏龍"], cal: 28, p: 0, c: 7.0, f: 0 },
            { name: "50嵐 拿鐵系列", keywords: ["50嵐拿鐵", "四季拿鐵", "黃金烏龍拿鐵", "阿華田拿鐵"], cal: 52, p: 2.2, c: 6.5, f: 1.8 },
            { name: "50嵐 珍珠奶茶 / 奶綠", keywords: ["50嵐珍奶", "50嵐珍珠奶茶", "珍珠奶茶", "波霸奶茶", "50嵐波霸"], cal: 112, p: 1.2, c: 19.5, f: 3.2 },
            { name: "50嵐 冰淇淋紅茶 / 綠茶", keywords: ["50嵐冰淇淋", "冰淇淋紅茶", "冰淇淋綠茶"], cal: 72, p: 0.8, c: 12.0, f: 2.2 },

            // 7-11
            { name: "7-11 關東煮（一般品項平均）", keywords: ["7-11關東煮", "關東煮", "711關東煮", "黑輪", "甜不辣"], cal: 110, p: 5.5, c: 12.0, f: 4.2 },
            { name: "7-11 肉包 / 饅頭", keywords: ["7-11肉包", "7-11饅頭", "叉燒包", "肉包", "黑糖饅頭"], cal: 235, p: 7.2, c: 38.0, f: 5.5 },
            { name: "7-11 麵包 / 吐司", keywords: ["7-11麵包", "7-11吐司", "吐司", "夾心麵包"], cal: 295, p: 7.8, c: 46.0, f: 8.5 },

            // 麥當勞
            { name: "麥當勞 雙層牛肉起司堡", keywords: ["雙層牛肉起司堡", "雙層牛肉吉士堡", "雙層吉士堡", "麥當勞雙牛堡"], cal: 265, p: 14.5, c: 19.0, f: 14.5 },
            { name: "麥當勞 麥脆雞（原味/辣味）", keywords: ["麥脆雞", "麥脆鷄", "麥當勞炸雞", "脆雞腿", "脆雞翅", "脆雞排"], cal: 255, p: 16.5, c: 11.5, f: 15.8 },
            { name: "麥當勞 漢堡 / 滿福堡類", keywords: ["麥當勞漢堡", "滿福堡", "豬肉滿福堡", "麥香雞", "麥香魚"], cal: 255, p: 12.0, c: 26.0, f: 11.0 },
            { name: "麥當勞 薯條 / 薯餅", keywords: ["麥當勞薯條", "薯條", "薯餅", "麥當勞薯餅"], cal: 315, p: 3.8, c: 38.0, f: 16.0 },
            { name: "麥當勞 麥克雞塊 / 炸雞", keywords: ["麥克雞塊", "雞塊", "麥當勞雞塊"], cal: 265, p: 15.0, c: 15.0, f: 16.0 },
            { name: "麥當勞 蘋果派 / 甜品", keywords: ["蘋果派", "麥當勞蘋果派", "奶昔"], cal: 285, p: 3.0, c: 39.0, f: 13.0 },

            // 台灣炸物店常見品項
            { name: "炸物店 鹹酥雞 / 無骨鹽酥雞", keywords: ["鹹酥雞", "鹽酥雞", "無骨鹹酥雞", "炸雞丁", "炸物", "炸物店"], cal: 285, p: 18.5, c: 11.0, f: 18.5 },
            { name: "炸物店 雞排 / 脆皮雞排", keywords: ["雞排", "脆皮雞排", "香雞排", "炸雞排"], cal: 310, p: 19.5, c: 13.5, f: 19.8 },
            { name: "炸物店 甜不辣", keywords: ["炸甜不辣", "甜不辣"], cal: 240, p: 7.5, c: 24.0, f: 12.5 },
            { name: "炸物店 米血糕", keywords: ["炸米血", "米血糕", "豬血糕"], cal: 205, p: 5.5, c: 31.0, f: 6.5 },
            { name: "炸物店 四季豆 / 炸青菜", keywords: ["炸四季豆", "四季豆", "炸青菜", "炸花椰菜", "炸菇"], cal: 155, p: 3.2, c: 9.5, f: 11.5 },
            { name: "炸物店 百頁豆腐", keywords: ["炸百頁", "百頁豆腐", "百頁"], cal: 250, p: 12.0, c: 6.0, f: 19.5 },
            { name: "炸物店 魷魚腳 / 花枝丸", keywords: ["炸魷魚", "魷魚腳", "花枝丸", "炸花枝"], cal: 235, p: 14.0, c: 14.5, f: 13.5 },

            // 八方雲集
            { name: "八方雲集 鍋貼", keywords: ["八方鍋貼", "鍋貼", "招牌鍋貼", "韭菜鍋貼", "韓式鍋貼"], cal: 214, p: 8.0, c: 22.0, f: 10.5 },
            { name: "八方雲集 水餃", keywords: ["八方水餃", "水餃", "招牌水餃", "韭菜水餃", "鮮蝦水餃"], cal: 178, p: 7.5, c: 20.0, f: 7.5 },
            { name: "八方雲集 乾麵 / 湯麵", keywords: ["八方乾麵", "八方湯麵", "麻醬麵", "酸辣湯麵", "榨菜肉絲麵"], cal: 165, p: 5.5, c: 24.0, f: 5.2 },
            { name: "八方雲集 湯品 / 小菜", keywords: ["八方酸辣湯", "八方玉米濃湯", "酸辣湯", "玉米濃湯", "滷蛋"], cal: 75, p: 3.2, c: 8.5, f: 3.0 },

            // 便當店
            { name: "便當 炸排骨 / 炸雞腿飯", keywords: ["炸排骨便當", "炸排骨", "炸雞腿飯", "炸雞腿便當", "排骨飯", "雞腿飯", "便當"], cal: 215, p: 9.5, c: 25.0, f: 8.5 },
            { name: "便當 滷肉 / 控肉 / 豬腳飯", keywords: ["控肉飯", "滷肉飯", "豬腳飯", "腿庫飯"], cal: 225, p: 8.5, c: 24.0, f: 10.5 },
            { name: "便當 烤/滷/瘦肉便當", keywords: ["烤雞腿便當", "滷雞腿便當", "紅燒排骨便當", "牛肉燴飯", "咖哩雞飯"], cal: 185, p: 10.0, c: 23.0, f: 5.8 },

            // 錢都涮涮鍋
            { name: "錢都 低脂牛", keywords: ["低脂牛", "錢都低脂牛", "瘦牛肉片"], cal: 150, p: 21.5, c: 0.5, f: 6.8 },
            { name: "錢都 雪花牛", keywords: ["雪花牛", "錢都雪花牛", "牛五花", "培根牛"], cal: 365, p: 14.0, c: 0.5, f: 34.0 },
            { name: "錢都 低脂雞肉 / 海鮮鍋食材", keywords: ["錢都雞肉", "錢都海鮮", "錢都低脂雞肉", "錢都虱目魚"], cal: 95, p: 12.0, c: 5.0, f: 2.8 },
            { name: "錢都 培根豬 / 霜降鍋食材", keywords: ["錢都", "錢都涮涮鍋", "培根豬", "霜降豬", "火鍋"], cal: 185, p: 10.5, c: 6.5, f: 13.0 }
        ];

        const COOK_MAP = {
            boil: { label: "水煮/清蒸", extraFatPer100: 0, extraCarbPer100: 0 },
            pan_light: { label: "乾煎/少油炒", extraFatPer100: 2.5, extraCarbPer100: 0 },
            stir_braise: { label: "一般炒/紅燒/滷", extraFatPer100: 5.0, extraCarbPer100: 2.5 },
            deep_fry: { label: "油炸/裹粉", extraFatPer100: 11.0, extraCarbPer100: 9.0 }
        };

        const foodInput = document.getElementById("foodInput");
        const gramsInput = document.getElementById("gramsInput");
        const cookSelect = document.getElementById("cookMethod");
        const quickFoodsEl = document.getElementById("quickFoods");
        const datalistEl = document.getElementById("foodDatalist");
        const matchStatusEl = document.getElementById("matchStatus");
        const logListEl = document.getElementById("logList");

        let logs = JSON.parse(localStorage.getItem("weight_sys_food_logs") || "[]");

        function findFoodInfo(rawQuery) {
            const q = rawQuery.trim().toLowerCase();
            if (!q) {
                return { matched: false, name: "未輸入食物", cal: 0, p: 0, c: 0, f: 0 };
            }

            let found = FOOD_DB.find(item => item.name.toLowerCase() === q);
            if (!found) {
                found = FOOD_DB.find(item => {
                    const cleanName = item.name.split("（")[0].toLowerCase();
                    return cleanName.includes(q) || q.includes(cleanName);
                });
            }
            if (!found) {
                found = FOOD_DB.find(item =>
                    item.keywords.some(kw => kw.toLowerCase().includes(q) || q.includes(kw.toLowerCase()))
                );
            }

            if (found) {
                return {
                    matched: true,
                    matchedName: found.name,
                    cal: found.cal,
                    p: found.p,
                    c: found.c,
                    f: found.f
                };
            }

            return {
                matched: false,
                matchedName: rawQuery.trim(),
                cal: 140,
                p: 8.0,
                c: 15.0,
                f: 5.0
            };
        }

        function initFoods() {
            const quickList = [
                "雞胸肉",
                "麥當勞 雙層牛肉起司堡",
                "麥當勞 麥脆雞（原味/辣味）",
                "炸物店 鹹酥雞 / 無骨鹽酥雞",
                "錢都 低脂牛",
                "錢都 雪花牛"
            ];
            FOOD_DB.forEach(item => {
                const opt = document.createElement("option");
                opt.value = item.name;
                datalistEl.appendChild(opt);
            });

            quickList.forEach(name => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "btn-chip";
                btn.textContent = name.split("（")[0].replace(/^(麥當勞|炸物店|錢都)\s*/, "");
                btn.onclick = () => {
                    foodInput.value = name;
                    calcNow();
                };
                quickFoodsEl.appendChild(btn);
            });
        }

        function setGrams(g) {
            gramsInput.value = g;
            calcNow();
        }

        function calcNow() {
            const query = foodInput.value.trim();
            const grams = Math.max(0, parseFloat(gramsInput.value) || 0);
            const ratio = grams / 100;
            const cook = COOK_MAP[cookSelect.value] || COOK_MAP.boil;

            const info = findFoodInfo(query);

            if (!query) {
                matchStatusEl.className = "match-badge fallback";
                matchStatusEl.textContent = "請在上方輸入食物或店家品項，系統會自動帶入熱量基準。";
            } else if (info.matched) {
                matchStatusEl.className = "match-badge";
                matchStatusEl.innerHTML = `已自動辨識為：<strong>${info.matchedName}</strong>（每 100g 基準 ${info.cal} kcal｜蛋白質 ${info.p}g / 碳水 ${info.c}g / 脂肪 ${info.f}g）`;
            } else {
                matchStatusEl.className = "match-badge fallback";
                matchStatusEl.innerHTML = `資料庫無「<strong>${query}</strong>」精確資料，已採用一般食物平均值（每 100g 約 140 kcal）自動估算。`;
            }

            const extraFat = cook.extraFatPer100 * ratio;
            const extraCarb = cook.extraCarbPer100 * ratio;
            const rawCal = info.cal * ratio;
            const extraCal = extraFat * 9 + extraCarb * 4;
            const totalCal = rawCal + extraCal;

            const totalP = info.p * ratio;
            const totalC = info.c * ratio + extraCarb;
            const totalF = info.f * ratio + extraFat;

            document.getElementById("totalCal").textContent = Math.round(totalCal);
            document.getElementById("rawCal").textContent = Math.round(rawCal);
            document.getElementById("extraCal").textContent = `+${Math.round(extraCal)}`;
            document.getElementById("totalPro").textContent = totalP.toFixed(1);
            document.getElementById("totalCarb").textContent = totalC.toFixed(1);
            document.getElementById("totalFat").textContent = totalF.toFixed(1);

            return {
                name: query || "未命名食物",
                grams,
                cookLabel: cook.label,
                cal: Math.round(totalCal),
                p: parseFloat(totalP.toFixed(1)),
                c: parseFloat(totalC.toFixed(1)),
                f: parseFloat(totalF.toFixed(1))
            };
        }

        function renderLogs() {
            logListEl.innerHTML = "";
            let sumCal = 0, sumP = 0, sumC = 0, sumF = 0;

            if (logs.length === 0) {
                logListEl.innerHTML = `<p style="color:#64748b; font-size:0.9rem;">目前還沒有加入任何食物紀錄。</p>`;
            } else {
                logs.forEach((item, index) => {
                    sumCal += item.cal;
                    sumP += item.p;
                    sumC += item.c;
                    sumF += item.f;

                    const div = document.createElement("div");
                    div.className = "log-item";
                    div.innerHTML = `
                        <div>
                            <strong>${item.name}</strong>（${item.grams}g · ${item.cookLabel}）
                            <div style="font-size:0.82rem; color:#475569;">
                                蛋白質 ${item.p}g / 碳水 ${item.c}g / 脂肪 ${item.f}g
                            </div>
                        </div>
                        <div style="display:flex; align-items:center; gap:10px;">
                            <strong>${item.cal} kcal</strong>
                            <button type="button" class="btn-danger-sm" onclick="removeLog(${index})">刪除</button>
                        </div>
                    `;
                    logListEl.appendChild(div);
                });
            }

            document.getElementById("dayTotalCal").textContent = Math.round(sumCal);
            document.getElementById("dayTotalPro").textContent = sumP.toFixed(1);
            document.getElementById("dayTotalCarb").textContent = sumC.toFixed(1);
            document.getElementById("dayTotalFat").textContent = sumF.toFixed(1);
            localStorage.setItem("weight_sys_food_logs", JSON.stringify(logs));
        }

        function removeLog(i) {
            logs.splice(i, 1);
            renderLogs();
        }

        [foodInput, gramsInput, cookSelect].forEach(el => {
            el.addEventListener("input", calcNow);
            el.addEventListener("change", calcNow);
        });

        document.getElementById("addBtn").addEventListener("click", () => {
            const data = calcNow();
            if (!foodInput.value.trim() || data.grams <= 0) return;
            logs.unshift(data);
            renderLogs();
        });

        document.getElementById("clearBtn").addEventListener("click", () => {
            logs = [];
            renderLogs();
        });

        initFoods();
        calcNow();
        renderLogs();
    </script>
</body>
</html>
