<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人體重管理系統</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="container">
            <h1 class="site-title">個人體重管理系統</h1>
            <p class="tagline">輕鬆記錄與管理每日飲食與健康目標，建立永續的好習慣。</p>
        </div>
    </header>

    <main class="container content">
        
        <!-- 可食用的食物 -->
        <section class="card">
            <h2>可食用的食物</h2>
            <ul class="food-list">
                <li>
                    <strong>優質蛋白質：</strong>雞胸肉、鮭魚、豆腐、雞蛋、無糖豆漿
                </li>
                <li>
                    <strong>高纖蔬菜：</strong>花椰菜、菠菜、地瓜葉、高麗菜、小黃瓜
                </li>
                <li>
                    <strong>複合澱粉：</strong>地瓜、糙米飯、燕麥、南瓜、芋頭
                </li>
                <li>
                    <strong>健康油脂與堅果：</strong>橄欖油、酪梨、原味綜合堅果
                </li>
            </ul>
        </section>

        <!-- 管理體重規則 -->
        <section class="card">
            <h2>管理體重規則</h2>
            <ol class="rules-list">
                <li>每日維持規律作息，並固定於早晨空腹時記錄體重。</li>
                <li>每日飲水量達到體重（公斤）× 30~40 ml。</li>
                <li>優先選擇原型食物，避免加工食品與高糖飲料。</li>
                <li>控制每餐總熱量攝取，並維持均衡的三大營養素比例。</li>
            </ol>
        </section>

    </main>

    <script>
        // JavaScript 程式碼
        document.addEventListener('DOMContentLoaded', () => {
            console.log('個人體重管理系統首頁載入完成');
        });
    </script>
</body>
</html>
