<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人體重管理系統 - 會員登入</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header class="header">
        <div class="container">
            <h1 class="site-title">個人體重管理系統</h1>
            <p class="tagline">輕鬆記錄與管理每日飲食與健康目標，建立永續的好習慣。</p>
            <nav class="nav-bar">
                <a href="index.html" class="nav-link">首頁</a>
                <a href="food.html" class="nav-link">可食用食物</a>
                <a href="rules.html" class="nav-link">管理體重規則</a>
                <a href="record.html" class="nav-link">體重紀錄</a>
                <a href="login.html" class="nav-link active">登入 / 註冊</a>
            </nav>
        </div>
    </header>

    <main class="container content">
        <section class="card" style="max-width: 400px; margin: 20px auto;">
            <h2 id="form-title">會員登入</h2>
            
            <!-- 登入後顯示的狀態區 -->
            <div id="user-status" style="display: none; margin-top: 15px;">
                <p>目前登入帳號：<strong id="user-email"></strong></p>
                <button id="logout-btn" style="width: 100%; padding: 10px; background: #e74c3c; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px;">登出</button>
            </div>

            <!-- 登入/註冊表單區 -->
            <form id="auth-form" style="display: flex; flex-direction: column; gap: 15px; margin-top: 15px;">
                <div>
                    <label for="email" style="display: block; margin-bottom: 5px;">電子信箱 (Email)</label>
                    <input type="email" id="email" required placeholder="example@email.com" style="width: 100%; padding: 8px; box-sizing: border-box;">
                </div>
                <div>
                    <label for="password" style="display: block; margin-bottom: 5px;">密碼 (至少 6 碼)</label>
                    <input type="password" id="password" required minlength="6" placeholder="請輸入密碼" style="width: 100%; padding: 8px; box-sizing: border-box;">
                </div>
                
                <div style="display: flex; gap: 10px;">
                    <button type="submit" id="login-btn" style="flex: 1; padding: 10px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer;">登入</button>
                    <button type="button" id="signup-btn" style="flex: 1; padding: 10px; background: #2ecc71; color: white; border: none; border-radius: 5px; cursor: pointer;">註冊新帳號</button>
                </div>
            </form>

            <p id="auth-message" style="margin-top: 15px; font-weight: bold;"></p>
        </section>
    </main>

    <script>
        const SUPABASE_URL = 'https://vnjkvlldzdlldpnvwqqa.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_YIyuePWhcZ3BgsyYfwvXDQ_Mqh4ePa5';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const authForm = document.getElementById('auth-form');
        const userStatus = document.getElementById('user-status');
        const userEmailSpan = document.getElementById('user-email');
        const authMessage = document.getElementById('auth-message');
        const formTitle = document.getElementById('form-title');

        // 檢查目前登入狀態
        async function checkUser() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                formTitle.textContent = '帳號狀態';
                authForm.style.display = 'none';
                userStatus.style.display = 'block';
                userEmailSpan.textContent = session.user.email;
            } else {
                formTitle.textContent = '會員登入';
                authForm.style.display = 'flex';
                userStatus.style.display = 'none';
            }
        }

        // 處理登入
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            authMessage.style.color = '#333';
            authMessage.textContent = '登入中...';

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                authMessage.style.color = 'red';
                authMessage.textContent = '登入失敗：' + error.message;
            } else {
                authMessage.style.color = 'green';
                authMessage.textContent = '登入成功！';
                checkUser();
            }
        });

        // 處理註冊
        document.getElementById('signup-btn').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if (!email || password.length < 6) {
                authMessage.style.color = 'red';
                authMessage.textContent = '請輸入有效的 Email 與至少 6 碼的密碼';
                return;
            }

            authMessage.style.color = '#333';
            authMessage.textContent = '註冊中...';

            const { data, error } = await supabaseClient.auth.signUp({ email, password });

            if (error) {
                authMessage.style.color = 'red';
                authMessage.textContent = '註冊失敗：' + error.message;
            } else {
                authMessage.style.color = 'green';
                authMessage.textContent = '註冊成功！請點擊登入或確認狀態。';
                checkUser();
            }
        });

        // 處理登出
        document.getElementById('logout-btn').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            authMessage.textContent = '已成功登出。';
            checkUser();
        });

        // 網頁載入時檢查登入狀態
        document.addEventListener('DOMContentLoaded', checkUser);
    </script>
</body>
</html>
