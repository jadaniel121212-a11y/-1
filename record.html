<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人體重管理系統 - 體重紀錄</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header class="header">
        <div class="container">
            <h1 class="site-title">個人體重管理系統</h1>
            <p class="tagline">輕鬆記錄與管理每日飲食與健康目標，建立永續的好習慣。</p>
            <nav class="nav-bar">
                <a href="index.html" class="nav-link">首頁</a>
                <a href="food.html" class="nav-link">可食用食物</a>
                <a href="rules.html" class="nav-link">管理體重規則</a>
                <a href="record.html" class="nav-link active">體重紀錄</a>
                <a href="login.html" class="nav-link">登入 / 註冊</a>
            </nav>
        </div>
    </header>

    <main class="container content">
        <section class="card">
            <h2>體重紀錄</h2>
            <div id="record-container" style="margin-top: 20px;">
                <p>資料載入中...</p>
            </div>
        </section>
    </main>

    <script>
        const SUPABASE_URL = 'https://vnjkvlldzdlldpnvwqqa.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_YIyuePWhcZ3BgsyYfwvXDQ_Mqh4ePa5';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function fetchWeightRecords() {
            const container = document.getElementById('record-container');
            
            try {
                const { data, error } = await supabaseClient
                    .from('weight_records')
                    .select('*')
                    .order('record_date', { ascending: false });

                if (error) {
                    throw error;
                }

                if (!data || data.length === 0) {
                    container.innerHTML = '<p>目前沒有任何體重紀錄。</p>';
                    return;
                }

                let html = '<ul style="list-style-type: none; padding: 0;">';
                data.forEach(record => {
                    html += `
                        <li style="padding: 10px 0; border-bottom: 1px solid #eee;">
                            <strong>日期：</strong> ${record.record_date} | 
                            <strong>體重：</strong> ${record.weight} 公斤 
                            ${record.note ? `| <strong>備註：</strong> ${record.note}` : ''}
                        </li>
                    `;
                });
                html += '</ul>';
                container.innerHTML = html;

            } catch (error) {
                console.error('讀取資料失敗:', error.message);
                container.innerHTML = `<p style="color: red;">載入失敗：${error.message}</p>`;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchWeightRecords();
        });
    </script>
</body>
</html>
